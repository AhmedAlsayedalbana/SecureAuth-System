{% extends "base.html" %}

{% block title %}2FA Verification - SecureAuth{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="auth-header">
        <div class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#6a11cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h2>Two-Factor Verification</h2>
        <p class="auth-subtitle">Enter the 6-digit code from your authenticator app</p>
    </div>

    <form method="POST" action="/verify" class="auth-form">
        <div class="form-group">
            <label for="code">Authentication Code</label>
            <input type="text"
                   id="code"
                   name="code"
                   placeholder="000000"
                   maxlength="6"
                   minlength="6"
                   pattern="\d{6}"
                   inputmode="numeric"
                   autocomplete="one-time-code"
                   class="otp-input"
                   required
                   autofocus>
        </div>
        <button type="submit">Verify</button>
    </form>

    <p class="auth-footer"><a href="/login" class="inline-link">Back to Login</a></p>
</div>
{% endblock %}
